# DevSpace Configuration for AI Chatbot
# Enables Kubernetes-native development with hot-reload
#
# Architecture:
#   - Replaces production container with devcontainer (full build tools)
#   - Syncs local files to container in real-time
#   - Runs Next.js dev server with hot module replacement
#   - Integrates with existing OTEL observability stack
#
# Usage:
#   devenv up          # Start via process-compose (recommended)
#   devspace dev       # Direct devspace invocation
#   devspace enter     # Shell into container
#   devspace purge     # Clean up devspace resources

version: v2beta1
name: ai-chatbot

# Import shared variable definitions from templates
imports:
  - path: ../../stacks/main/devspace-templates/base.yaml
  - path: ../../stacks/main/devspace-templates/snippets/nextjs.yaml

# App-specific variable values
vars:
  APP_NAME: ai-chatbot
  WORKLOAD_NAMESPACE: workflow-builder
  LOCAL_PORT: "3000"
  CONTAINER_PORT: "3000"
  SSH_PORT: "2222"
  APP_PUBLIC_URL: "https://ai-chatbot-ryzen.tail286401.ts.net"
  INTERNAL_API_TOKEN:
    command: |
      kubectl get secret workflow-builder-secrets -n workflow-builder -o jsonpath='{.data.INTERNAL_API_TOKEN}' 2>/dev/null | base64 -d || true
    default: ""
  RUN_MIGRATIONS: "true"
  MIGRATION_COMMAND: "pnpm tsx lib/db/migrate"
  INSTALL_CLAUDE_CLI: "true"
  CURRENT_IMAGE_TAG:
    command: |
      kubectl get deployment ${APP_NAME} -n ${WORKLOAD_NAMESPACE} -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null |
      sed 's/.*://' || echo "latest"
    default: "latest"
  CURRENT_PRODUCTION_IMAGE:
    command: |
      kubectl get deployment ${APP_NAME} -n ${WORKLOAD_NAMESPACE} -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null ||
      echo "${GITEA_HOST}/${GITEA_USER}/${APP_NAME}:latest"
    default: "${GITEA_HOST}/${GITEA_USER}/${APP_NAME}:latest"

# Development configuration
dev:
  app:
    # Target the live deployment by stable workload labels
    namespace: ${WORKLOAD_NAMESPACE}
    labelSelector:
      app: ai-chatbot
      app.kubernetes.io/name: ai-chatbot
    container: ${APP_NAME}

    # Use shared devcontainer (instead of per-app image)
    devImage: node:22-bullseye
    workingDir: /app

    # Resource requirements for development
    resources:
      requests:
        cpu: ${CPU_REQUEST}
        memory: ${MEMORY_REQUEST}
      limits:
        cpu: ${CPU_LIMIT}
        memory: ${MEMORY_LIMIT}

    # Command to run in the container
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "=== DevSpace Development Container ==="
        echo "Replacing production image: ${CURRENT_PRODUCTION_IMAGE}"
        echo "Using shared devcontainer: nodejs-22-devspace"
        echo ""

        # Install Claude Code CLI globally (for Claude Code provider)
        echo "Installing Claude Code CLI..."
        npm install -g @anthropic-ai/claude-code --prefix /usr/local 2>/dev/null || echo "Claude CLI already installed"

        # Always enable corepack and pnpm (required even if node_modules cached)
        echo "Enabling corepack and pnpm..."
        corepack enable
        corepack prepare pnpm@${PNPM_VERSION} --activate

        echo "Checking dependencies..."
        # Only install if node_modules is missing or package.json changed
        if [ ! -d "node_modules" ] || [ ! -f "node_modules/.pnpm-lock-hash" ] || \
           [ "$(cat node_modules/.pnpm-lock-hash 2>/dev/null)" != "$(md5sum pnpm-lock.yaml | cut -d' ' -f1)" ]; then
          echo "Installing dependencies..."
          pnpm install --frozen-lockfile
          md5sum pnpm-lock.yaml | cut -d' ' -f1 > node_modules/.pnpm-lock-hash
        else
          echo "Dependencies up to date (cached)"
        fi

        # Run database migrations (idempotent - only applies pending migrations)
        echo "Running database migrations..."
        pnpm tsx lib/db/migrate || echo "Migrations skipped (database may not be ready)"

        echo "Starting Next.js development server..."
        exec pnpm dev --hostname 0.0.0.0 --port ${CONTAINER_PORT}

    # File synchronization
    sync:
      - path: ./:/app
        initialSync: mirrorLocal
        disableDownload: true
        polling: true
        startContainer: true
        waitInitialSync: true
        onUpload:
          restartContainer: false
          exec:
            - name: install-dependencies
              command: sh
              args:
                - -lc
                - cd /app && corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate && pnpm install --frozen-lockfile
              failOnError: true
              onChange:
                - package.json
                - pnpm-lock.yaml
        excludePaths:
          # Node.js / Next.js artifacts
          - node_modules/
          - .pnpm-store/
          - .next/
          - dist/
          - out/
          - coverage/
          - next-env.d.ts
          # Dev tooling
          - .devenv/
          - .devspace/
          - .direnv/
          - .git
          - .git/
          - .github/
          - .idea/
          - .vscode/
          - .cursor/
          # Test files
          - tests/
          - playwright-report/
          - test-results/
          - playwright.config.ts
          - vitest.config.ts
          # Docs & config
          - docs/
          - scripts/
          - "*.md"
          - "*.log"
          - LICENSE
          - Dockerfile
          - Dockerfile.devspace
          - devenv.*
          - devenv.lock
          - .devenv*
          - .devenv.flake.nix
          - biome.jsonc
          - .dockerignore
          - .gitignore
          - .env.local
          - .env.example
          # App-specific
          - cookies.txt

    # Persistent paths for faster subsequent starts
    persistPaths:
      - path: /tmp
        skipPopulate: true
      - path: /app/node_modules

    # Patches to configure the pod for development
    patches:
      - op: remove
        path: spec.initContainers
      - op: remove
        path: spec.containers.name=ai-chatbot-proxy
      - op: remove
        path: spec.containers.name=${APP_NAME}.livenessProbe
      - op: remove
        path: spec.containers.name=${APP_NAME}.readinessProbe
      - op: remove
        path: spec.containers.name=${APP_NAME}.startupProbe
      - op: replace
        path: spec.containers.name=${APP_NAME}.securityContext
        value:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
      - op: replace
        path: spec.securityContext
        value:
          fsGroup: 1001
          runAsNonRoot: false

    # Port forwarding for development
    ports:
      - port: "${LOCAL_PORT}:${CONTAINER_PORT}"

    # SSH access for debugging
    ssh:
      enabled: true
      localPort: 2222

    # Environment variables for development
    # Note: Most config values come from Dapr Configuration (Azure App Config)
    # Only set dev-specific overrides here that aren't in app config
    env:
      - name: NODE_ENV
        value: development
      - name: NEXT_TELEMETRY_DISABLED
        value: "1"
      - name: NEXT_PUBLIC_APP_URL
        value: ${APP_PUBLIC_URL}
      - name: APP_URL
        value: ${APP_PUBLIC_URL}
      - name: AUTH_URL
        value: ${APP_PUBLIC_URL}
      - name: NEXTAUTH_URL
        value: ${APP_PUBLIC_URL}
      - name: INTERNAL_API_TOKEN
        value: ${INTERNAL_API_TOKEN}
