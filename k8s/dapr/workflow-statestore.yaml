# Workflow State Store Component
#
# Dapr component for the workflow runtime.
# Uses Redis with actor state store enabled for orchestration.
#
# The Dapr workflow runtime requires a state store named "statestore"
# with actorStateStore: "true" for the actor framework.
#
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: planner-agent
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis.ai-chatbot.svc.cluster.local:6379
    - name: keyPrefix
      value: workflow
    - name: actorStateStore
      value: "true"
