# Agent Registry State Store Component
#
# Dapr component configuration for the agent registry.
# Uses Redis for persistent storage of agent metadata.
#
# Agents register themselves at startup with:
# - App ID
# - Team name
# - Capabilities
# - Endpoints
#
# This enables dynamic service discovery via the AgentRegistry class.
#
# IMPORTANT: This component must be deployed to EACH namespace that uses it:
# - ai-chatbot namespace (for reading agent registry)
# - planner-agent namespace (for registering the agent)
#
# Apply with:
#   # For ai-chatbot namespace
#   kubectl apply -f agent-registry-statestore.yaml
#
#   # For planner-agent namespace (change namespace first)
#   sed 's/namespace: ai-chatbot/namespace: planner-agent/' agent-registry-statestore.yaml | kubectl apply -f -
#
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: agentregistrystore
  namespace: ai-chatbot
spec:
  type: state.redis
  version: v1
  metadata:
    # Redis connection configuration
    # Uses the Redis service in the ai-chatbot namespace
    # This is accessible from all namespaces in the cluster
    - name: redisHost
      value: redis.ai-chatbot.svc.cluster.local:6379
    # Key prefix to isolate agent registry data
    - name: keyPrefix
      value: agent-registry
    # State store options - false since statestore is the actor state store
    - name: actorStateStore
      value: "false"
---
