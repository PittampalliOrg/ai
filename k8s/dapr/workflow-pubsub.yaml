# Pubsub component for workflow events from planner-agent
# Points to the dapr-agents Redis to receive workflow.stream events
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-pubsub
  namespace: ai-chatbot
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-service.dapr-agents.svc.cluster.local:6379
    - name: redisPassword
      value: ""
---
# Subscription for workflow stream events
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: workflow-stream-subscription
  namespace: ai-chatbot
spec:
  pubsubname: workflow-pubsub
  topic: workflow.stream
  routes:
    default: /api/webhooks/dapr/workflow-stream
scopes:
  - ai-chatbot
